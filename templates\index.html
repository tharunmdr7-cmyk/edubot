<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDY AI</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #172033;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .chat-app {
            width: min(900px, 100%);
            height: min(760px, calc(100vh - 48px));
            background: #ffffff;
            border: 1px solid #e5e9f2;
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(27, 39, 68, 0.10);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px 24px;
            border-bottom: 1px solid #e9edf5;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: #172033;
            color: #ffffff;
            font-weight: 800;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .header p {
            margin: 3px 0 0;
            color: #68748a;
            font-size: 13px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 78%;
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .assistant {
            align-self: flex-start;
            background: #f0f3f8;
        }

        .user {
            align-self: flex-end;
            background: #172033;
            color: #ffffff;
        }

        .composer {
            padding: 16px;
            border-top: 1px solid #e9edf5;
            background: #ffffff;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 52px;
            max-height: 150px;
            border: 1px solid #dce2ed;
            border-radius: 14px;
            padding: 14px 15px;
            outline: none;
            font: inherit;
        }

        textarea:focus {
            border-color: #172033;
        }

        button {
            width: 110px;
            border: 0;
            border-radius: 14px;
            background: #172033;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .hint {
            margin: 8px 3px 0;
            color: #8a94a6;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-app {
                height: 100vh;
                border: 0;
                border-radius: 0;
            }

            .messages {
                padding: 20px 16px;
            }

            .message {
                max-width: 88%;
            }

            button {
                width: 82px;
            }
        }
    </style>
</head>
<body>
    <main class="chat-app">
        <header class="header">
            <div class="logo">S</div>
            <div>
                <h1>STUDY AI</h1>
                <p>Your focused AI study assistant</p>
            </div>
        </header>

        <section id="messages" class="messages" aria-live="polite">
            <div class="message assistant">
                Hi! I'm STUDY AI. Ask me a question about your studies, and I'll help you understand it.
            </div>
        </section>

        <form id="chat-form" class="composer">
            <div class="input-row">
                <textarea
                    id="message"
                    placeholder="Ask a study question..."
                    aria-label="Study question"
                    rows="1"
                    required
                ></textarea>
                <button id="send-button" type="submit">Send</button>
            </div>
            <div class="hint">STUDY AI answers study and education-related questions only.</div>
        </form>
    </main>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("send-button");

        function addMessage(text, role) {
            const message = document.createElement("div");
            message.className = `message ${role}`;
            message.textContent = text;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = `${Math.min(input.scrollHeight, 150)}px`;
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            input.style.height = "auto";
            sendButton.disabled = true;
            sendButton.textContent = "Thinking...";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Something went wrong.");
                }

                addMessage(data.answer, "assistant");
            } catch (error) {
                addMessage(error.message, "assistant");
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = "Send";
                input.focus();
            }
        });
    </script>
</body>
</html>
